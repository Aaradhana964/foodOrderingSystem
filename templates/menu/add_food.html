{% extends 'base.html' %}

{% block title %}Add Food{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-box">

        <h1>Add Food Item</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Save Food
            </button>

        </form>

    </div>

</div>

{% endblock %}
